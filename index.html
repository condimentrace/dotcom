<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="condimentrace.com - an unofficial Baltimore Orioles condiment standings page." />
    <title>condimentrace.com</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3e4d2;
        --panel: rgba(255, 246, 234, 0.94);
        --panel-strong: rgba(255, 247, 236, 0.98);
        --ink: #111111;
        --muted: #5c5248;
        --accent: #df4601;
        --accent-2: #2f7a4a;
        --accent-3: #d8a120;
        --ketchup: #c73b2d;
        --relish: #2f7a4a;
        --mustard: #d8a120;
        --ring: rgba(223, 70, 1, 0.2);
        --shadow: 0 28px 80px rgba(17, 17, 17, 0.2);
        --grid: rgba(17, 17, 17, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% -8%, rgba(223, 70, 1, 0.54), transparent 42%),
          radial-gradient(circle at 86% 2%, rgba(223, 70, 1, 0.24), transparent 36%),
          radial-gradient(circle at 72% 100%, rgba(216, 161, 32, 0.2), transparent 34%),
          linear-gradient(180deg, #fff1df 0%, var(--bg) 58%, #ead4b7 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(1120px, 100%);
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(223, 70, 1, 0.34);
        border-radius: 32px;
        box-shadow: var(--shadow), 0 0 0 1px rgba(223, 70, 1, 0.12), 0 20px 50px rgba(223, 70, 1, 0.12);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px clamp(28px, 5vw, 56px);
        border-bottom: 3px solid var(--accent);
        background: linear-gradient(110deg, #111111 0%, #2f1a0c 52%, #df4601 100%);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand strong {
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .brand span,
      .hero-kicker,
      .meta,
      .note,
      .panel p,
      .panel li,
      .legend,
      .smallprint {
        color: var(--muted);
      }

      .topbar .meta {
        font-size: 0.92rem;
        color: rgba(255, 232, 211, 0.84);
      }

      .topbar .brand strong {
        color: #fff3e4;
      }

      .topbar .brand span {
        color: rgba(255, 232, 211, 0.84);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.9fr);
        gap: 28px;
        padding: clamp(28px, 5vw, 56px);
        align-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(223, 70, 1, 0.14);
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 16px;
        font-size: clamp(3rem, 8vw, 6rem);
        line-height: 0.93;
        letter-spacing: -0.06em;
      }

      .lead {
        margin: 0;
        max-width: 60ch;
        font-size: clamp(1.05rem, 2.4vw, 1.35rem);
        line-height: 1.6;
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .hero-panel {
        background: var(--panel-strong);
        border-radius: 28px;
        border: 1px solid rgba(223, 70, 1, 0.28);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 0 1px rgba(223, 70, 1, 0.08);
        padding: 22px;
      }

      .hero-panel h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .scoreboard {
        display: grid;
        gap: 14px;
      }

      .score-row {
        display: grid;
        gap: 8px;
      }

      .score-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
      }

      .score-name {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .score-name strong {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-size: 1.02rem;
      }

      .score-streak {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        color: var(--accent);
      }

      .score-name span {
        font-size: 0.92rem;
        color: var(--muted);
      }

      .score-value {
        font-size: 2rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .bar-track {
        height: 12px;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.12);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--ketchup), #e05545);
      }

      .bar-fill.mustard {
        background: linear-gradient(90deg, var(--mustard), #e5b635);
      }

      .bar-fill.relish {
        background: linear-gradient(90deg, var(--relish), #3b9360);
      }

      .legend {
        margin: 14px 0 0;
        font-size: 0.92rem;
      }

      .as-of {
        margin: 0 0 14px;
        font-size: 0.92rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        padding: 0 clamp(28px, 5vw, 56px) clamp(28px, 5vw, 56px);
      }

      .panel {
        border-radius: 20px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(31, 27, 22, 0.07);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .panel p,
      .panel li {
        margin: 0;
        line-height: 1.55;
        font-size: 0.98rem;
      }

      .panel ul {
        margin: 0;
        padding-left: 18px;
      }

      .stamp {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 14px;
        background: linear-gradient(90deg, #111111 0%, #3a1f0e 70%, #df4601 100%);
        color: #fff1df;
        font-size: 0.92rem;
        font-weight: 700;
        border: 1px solid rgba(223, 70, 1, 0.32);
      }

      .hero-note {
        display: grid;
        gap: 12px;
      }

      .note-card {
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(31, 27, 22, 0.07);
      }

      .note-card strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
      }

      .note {
        margin-top: 18px;
        font-size: 0.9rem;
      }

      .note strong {
        color: var(--ink);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 20px clamp(28px, 5vw, 56px) 28px;
        border-top: 1px solid var(--grid);
        font-size: 0.9rem;
      }

      .footer p {
        margin: 0;
      }

      .footer small {
        color: var(--muted);
      }

      .chart-wrap {
        padding: 0 clamp(28px, 5vw, 56px) 28px;
      }

      .chart-card {
        border-radius: 24px;
        border: 1px solid rgba(223, 70, 1, 0.3);
        background: linear-gradient(180deg, rgba(255, 245, 232, 0.92), rgba(255, 239, 219, 0.9));
        padding: 20px;
      }

      .chart-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .chart-head h2 {
        margin: 0;
        font-size: 1.03rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .chart-head p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .series-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .series-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.92rem;
        color: var(--ink);
      }

      .series-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .chart-svg {
        width: 960px;
        height: 310px;
        display: block;
        background: linear-gradient(180deg, rgba(255, 240, 220, 0.96), rgba(246, 226, 194, 0.94));
        border-radius: 16px;
        border: 1px solid rgba(17, 17, 17, 0.24);
      }

      .chart-stage {
        position: relative;
        width: 960px;
        min-width: 960px;
      }

      .chart-scroll {
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
      }

      .point-tooltip {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        transform: translate(-50%, -115%);
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(17, 17, 17, 0.96);
        color: #fff4e8;
        font-size: 0.8rem;
        line-height: 1;
        white-space: nowrap;
        box-shadow: 0 10px 30px rgba(17, 17, 17, 0.28);
        border: 1px solid rgba(223, 70, 1, 0.46);
      }

      .point-tooltip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 10px;
        height: 10px;
        background: inherit;
        transform: translateX(-50%) rotate(45deg);
      }

      .chart-meta {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .chart-alert {
        margin: 0;
        color: var(--accent);
        font-size: 0.9rem;
      }

      .report-wrap {
        margin-top: 14px;
      }

      .report-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(223, 70, 1, 0.45);
        background: linear-gradient(90deg, rgba(17, 17, 17, 0.96) 0%, rgba(58, 31, 14, 0.96) 70%, rgba(223, 70, 1, 0.96) 100%);
        color: #fff3e6;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
      }

      .report-link:hover {
        filter: brightness(1.04);
      }

      @media (max-width: 760px) {
        .hero,
        .topbar {
          grid-template-columns: 1fr;
        }

        .topbar {
          display: grid;
          justify-content: initial;
        }

        .score-top {
          align-items: start;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
        }

        .chart-meta {
          flex-direction: column;
        }

        h1 {
          line-height: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const SERIES = [
        { key: "Ketchup", label: "🍅 Ketchup", color: "#c73b2d" },
        { key: "Mustard", label: "🟨 Mustard", color: "#d8a120" },
        { key: "Relish", label: "🥒 Relish", color: "#2f7a4a" },
      ];

      const EVENT_EMOJI = {
        Live: "🌭",
        Virtual: "🤖",
        Dog: "🐶",
      };

      const UNKNOWN_EVENT_EMOJI = "❓";

      const TEAM_PROFILES = [
        { name: "Ketchup", accent: "ketchup", note: "Red zone dominance" },
        { name: "Mustard", accent: "mustard", note: "Scorching hot streak" },
        { name: "Relish", accent: "relish", note: "Quietly dangerous" },
      ];

      function parseCsv(text) {
        const rows = [];
        let cell = "";
        let row = [];
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (char === '"' && next === '"') {
              cell += '"';
              i += 1;
            } else if (char === '"') {
              inQuotes = false;
            } else {
              cell += char;
            }
            continue;
          }

          if (char === '"') {
            inQuotes = true;
            continue;
          }

          if (char === ',') {
            row.push(cell);
            cell = "";
            continue;
          }

          if (char === "\n") {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
            continue;
          }

          if (char !== "\r") {
            cell += char;
          }
        }

        if (cell.length > 0 || row.length > 0) {
          row.push(cell);
          rows.push(row);
        }

        return rows;
      }

      function buildSeriesTimeline(records) {
        const known = new Set(SERIES.map((entry) => entry.key));
        const parsed = records
          .map((record) => ({
            date: record.event_date,
            event: (record.event || "").trim(),
            verified: (record.verified || "").trim().toUpperCase() === "TRUE",
            winner: (record.winner || "").trim(),
          }))
          .filter((record) => record.date)
          .sort((left, right) => left.date.localeCompare(right.date));

        const counts = Object.fromEntries(SERIES.map((entry) => [entry.key, 0]));
        const points = [];

        parsed.forEach((record) => {
          if (known.has(record.winner)) {
            counts[record.winner] += 1;
          }

          points.push({
            date: record.date,
            event: record.event,
            verified: record.verified,
            winner: record.winner,
            values: {
              Ketchup: counts.Ketchup,
              Mustard: counts.Mustard,
              Relish: counts.Relish,
            },
          });
        });

        return points;
      }

      function buildStandingsFromRecords(records) {
        const wins = Object.fromEntries(TEAM_PROFILES.map((team) => [team.name, 0]));
        const knownTeams = new Set(Object.keys(wins));
        const chronological = records
          .map((record, index) => ({
            index,
            date: (record.event_date || "").trim(),
            winner: (record.winner || "").trim(),
          }))
          .filter((record) => record.date && knownTeams.has(record.winner))
          .sort((left, right) => {
            const byDate = left.date.localeCompare(right.date);
            if (byDate !== 0) {
              return byDate;
            }

            return left.index - right.index;
          });

        chronological.forEach((record) => {
          const winner = record.winner;
          if (Object.prototype.hasOwnProperty.call(wins, winner)) {
            wins[winner] += 1;
          }
        });

        const withStreaks = TEAM_PROFILES.map((team) => {
          let streakType = "L";
          let streakCount = 0;

          for (let index = chronological.length - 1; index >= 0; index -= 1) {
            const wonRace = chronological[index].winner === team.name;

            if (streakCount === 0) {
              streakType = wonRace ? "W" : "L";
              streakCount = 1;
              continue;
            }

            if ((streakType === "W" && wonRace) || (streakType === "L" && !wonRace)) {
              streakCount += 1;
              continue;
            }

            break;
          }

          return {
            ...team,
            wins: wins[team.name],
            streak: `${streakType}${streakCount}`,
          };
        });

        return withStreaks.sort((left, right) => right.wins - left.wins);
      }

      function WinsChart({ points, onPointHover, onPointLeave }) {
        const width = 960;
        const height = 310;
        const margin = { top: 20, right: 22, bottom: 34, left: 42 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const maxWins = Math.max(
          1,
          ...points.map((point) => Math.max(point.values.Ketchup, point.values.Mustard, point.values.Relish))
        );

        const xAt = (index) => {
          if (points.length <= 1) return margin.left;
          return margin.left + (index / (points.length - 1)) * innerWidth;
        };

        const yAt = (wins) => margin.top + innerHeight - (wins / maxWins) * innerHeight;
        const markerYAt = (wins) => {
          return Math.max(margin.top + 14, yAt(wins) - 16);
        };

        return (
          <svg
            className="chart-svg"
            viewBox={`0 0 ${width} ${height}`}
            role="img"
            aria-label="Cumulative win totals over time for Ketchup, Mustard, and Relish"
          >
            {Array.from({ length: maxWins + 1 }, (_, index) => {
              const y = yAt(index);
              return (
                <React.Fragment key={`grid-${index}`}>
                  <line x1={margin.left} y1={y} x2={width - margin.right} y2={y} stroke="rgba(31,27,22,0.10)" strokeWidth="1" />
                  <text x={margin.left - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#685d54">{index}</text>
                </React.Fragment>
              );
            })}

            <line x1={margin.left} y1={height - margin.bottom} x2={width - margin.right} y2={height - margin.bottom} stroke="rgba(31,27,22,0.34)" strokeWidth="1.2" />
            <line x1={margin.left} y1={margin.top} x2={margin.left} y2={height - margin.bottom} stroke="rgba(31,27,22,0.34)" strokeWidth="1.2" />

            {points.length > 0 && (
              <>
                <text x={margin.left} y={height - 10} fontSize="11" fill="#685d54">{points[0].date}</text>
                <text x={width - margin.right} y={height - 10} textAnchor="end" fontSize="11" fill="#685d54">{points[points.length - 1].date}</text>
              </>
            )}

            {SERIES.map((series) => {
              const path = points
                .map((point, index) => `${index === 0 ? "M" : "L"} ${xAt(index)} ${yAt(point.values[series.key])}`)
                .join(" ");

              return (
                <path
                  key={series.key}
                  d={path}
                  fill="none"
                  stroke={series.color}
                  strokeWidth="3"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              );
            })}

            {points.map((point, index) => {
              const winningSeries = SERIES.find((series) => series.key === point.winner);
              if (!winningSeries) {
                return null;
              }

              const x = xAt(index);
              const y = markerYAt(point.values[winningSeries.key]);
              const emoji = EVENT_EMOJI[point.event] || UNKNOWN_EVENT_EMOJI;
              const markerLabel = point.verified ? emoji : `${emoji}*`;

              return (
                <g
                  key={`${point.date}-${point.winner}-${index}`}
                  aria-label={`${winningSeries.label} won on ${point.date}`}
                  onMouseEnter={() => onPointHover({ date: point.date, x, y })}
                  onMouseLeave={onPointLeave}
                >
                  <circle cx={x} cy={y} r="10" fill="rgba(255,255,255,0.9)" stroke="rgba(31,27,22,0.18)" strokeWidth="1" />
                  <text x={x} y={y + 5} textAnchor="middle" fontSize="14">
                    {markerLabel}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      }

      function App() {
        const [records, setRecords] = useState([]);
        const [points, setPoints] = useState([]);
        const [chartError, setChartError] = useState("");
        const [hoveredPoint, setHoveredPoint] = useState(null);
        const chartScrollRef = useRef(null);

        useEffect(() => {
          async function loadChartData() {
            try {
              const response = await fetch("./hot_dog_race_history.csv", { cache: "no-store" });
              if (!response.ok) {
                throw new Error(`CSV fetch failed with status ${response.status}`);
              }

              const csvText = await response.text();
              const table = parseCsv(csvText);
              if (table.length <= 1) {
                throw new Error("CSV has no data rows");
              }

              const headers = table[0];
              const records = table.slice(1).map((row) =>
                Object.fromEntries(headers.map((header, index) => [header, row[index] || ""]))
              );

              setRecords(records);
              setPoints(buildSeriesTimeline(records));
              setChartError("");
            } catch (error) {
              setRecords([]);
              setPoints([]);
              setChartError("Could not load hot_dog_race_history.csv for charting in this context.");
              console.error(error);
            }
          }

          loadChartData();
        }, []);

        useEffect(() => {
          const scroller = chartScrollRef.current;
          if (!scroller) {
            return;
          }

          scroller.scrollLeft = scroller.scrollWidth;
        }, [points.length]);

        const sortedStandings = useMemo(
          () => buildStandingsFromRecords(records),
          [records]
        );
        const totalWins = useMemo(() => sortedStandings.reduce((sum, team) => sum + team.wins, 0), [sortedStandings]);
        const maxWins = useMemo(() => Math.max(1, ...sortedStandings.map((team) => team.wins)), [sortedStandings]);
        const latestDate = useMemo(() => {
          if (records.length === 0) {
            return "--";
          }

          return records
            .map((record) => record.event_date)
            .filter(Boolean)
            .sort((left, right) => left.localeCompare(right))
            .at(-1);
        }, [records]);

        return (
          <main>
            <article className="card">
              <header className="topbar">
                <div className="brand">
                  <strong>Hot Dog Race Standings</strong>
                  <span>Baltimore Orioles Edition</span>
                </div>
                <div className="meta">2026 Season</div>
              </header>

              <section className="hero">
                <div className="hero-copy">
                  <div className="eyebrow">Baltimore Orioles Condiment Report</div>
                  <p className="lead">CondimentRace.com tracks the current hot dog race standings for the Baltimore Orioles.</p>
                  <div className="stamp">Live from the snack aisle: chaos in cleats</div>
                </div>

                <aside className="hero-panel" aria-label="Current standings">
                  <h2>Current standings</h2>
                  <p className="as-of">As of {latestDate}</p>
                  <div className="scoreboard">
                    {sortedStandings.map((team, index) => (
                      <div key={team.name} className="score-row">
                        <div className="score-top">
                          <div className="score-name">
                            <strong>#{index + 1} {team.name}<span className="score-streak">{team.streak}</span></strong>
                            <span>{team.note}</span>
                          </div>
                          <div className="score-value">{team.wins}</div>
                        </div>
                        <div className="bar-track" aria-hidden="true">
                          <div className={`bar-fill ${team.accent}`} style={{ width: `${Math.max(10, (team.wins / maxWins) * 100)}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p className="legend">Baltimore Orioles condiment standings total {totalWins} combined wins, with Ketchup leading the pack.</p>
                </aside>
              </section>

              <section className="chart-wrap" aria-label="Race time series">
                <div className="chart-card">
                  <div className="chart-head">
                    <h2>2026 Cumulative Wins</h2>
                  </div>

                  <div className="series-legend">
                    {SERIES.map((series) => (
                      <div key={series.key} className="series-item">
                        <span className="series-dot" style={{ background: series.color }}></span>
                        <span>{series.label}</span>
                      </div>
                    ))}
                  </div>

                  <div className="chart-scroll" ref={chartScrollRef}>
                    <div className="chart-stage">
                      <WinsChart
                        points={points}
                        onPointHover={setHoveredPoint}
                        onPointLeave={() => setHoveredPoint(null)}
                      />

                      {hoveredPoint && (
                        <div
                          className="point-tooltip"
                          style={{ left: `${(hoveredPoint.x / 960) * 100}%`, top: `${(hoveredPoint.y / 310) * 100}%` }}
                        >
                          {hoveredPoint.date}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="chart-meta">
                    <span>Date range: {points.length > 0 ? `${points[0].date} to ${points[points.length - 1].date}` : "--"}</span>
                    <span>Races plotted: {points.length}</span>
                  </div>

                  <div className="chart-meta" aria-label="Event emoji legend">
                    <span>🌭 In-person Race</span>
                    <span>🤖 On-screen Race</span>
                    <span>🐶 Corgi Race</span>
                    <span>❓ Unknown</span>
                  </div>

                  <div className="chart-meta">
                    <span>* indicates an unverified win, turns out it is hard to find this data</span>
                  </div>

                  <div className="report-wrap">
                    <a className="report-link" href="https://github.com/condimentrace/dotcom/issues" target="_blank" rel="noreferrer">
                      Catch a bad stat? Submit a correction!
                    </a>
                  </div>

                  {chartError && <p className="chart-alert">{chartError}</p>}
                </div>
              </section>

              <footer className="footer">
                <p>CondimentRace.com</p>
                <small>
                  &copy; 2026 CondimentRace.com<br />
                  Source: <a href="https://github.com/condimentrace/dotcom" target="_blank" rel="noreferrer">github.com/condimentrace/dotcom</a><br />
                  This is a parody/fan page and is not affiliated with or endorsed by MLB, the Baltimore Orioles, or any other team, league, mascot, or trademark owner.
                </small>
              </footer>
            </article>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
